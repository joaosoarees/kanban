services:
  app:
    build: .
    pull_policy: build
    init: true
    command: ./scripts/dev-start.sh
    environment:
      DATABASE_URL: postgresql://kanban:kanban@postgres:5432/kanban?schema=public
      SMTP_URL: smtp://mailpit:1025
      MAIL_FROM: Kanbanary <nao-responda@kanbanary.local>
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
