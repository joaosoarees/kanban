services:
  app:
    build: .
    pull_policy: build
    command: sh -c "bun install --frozen-lockfile && bunx prisma migrate deploy && bunx next dev --hostname 0.0.0.0"
    environment:
      DATABASE_URL: postgresql://kanban:kanban@postgres:5432/kanban?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanban
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
