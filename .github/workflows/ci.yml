name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - if: ${{ !cancelled() }}
        run: bunx next typegen
      - if: ${{ !cancelled() }}
        run: timeout 1 bun lint
      - if: ${{ !cancelled() }}
        run: timeout 1 bun fmt --check
      - if: ${{ !cancelled() }}
        run: timeout 5 bun check --no-script
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/budget
        with:
          seconds: 35

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - run: timeout 30 bun test --isolate=modules
      - uses: ./.github/actions/budget
        with:
          seconds: 35

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: blob:none
      - uses: ./.github/actions/setup
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'next.config.*', 'tsconfig.json') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun run build
      - uses: ./.github/actions/budget
        with:
          seconds: 35

  check:
    if: ${{ always() }}
    needs: [checks, test, build]
    runs-on: ubuntu-latest
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [check]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kanban.joaodevdude.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - name: Trigger the Coolify deployment
        id: trigger
        run: |
          response=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_APP_UUID")
          echo "$response" | jq .
          echo "uuid=$(echo "$response" | jq -er '.deployments[0].deployment_uuid')" >> "$GITHUB_OUTPUT"
      - name: Wait for the deployment to finish
        env:
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.uuid }}
        run: |
          while true; do
            status=$(curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT_UUID" | jq -r '.status')
            echo "deployment $DEPLOYMENT_UUID: $status"
            case "$status" in
              finished) exit 0 ;;
              queued|in_progress) sleep 10 ;;
              *) exit 1 ;;
            esac
          done
      - name: Check the live health endpoint
        run: curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://kanban.joaodevdude.com/api/health
