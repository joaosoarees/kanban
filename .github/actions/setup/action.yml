name: Setup
description: Bun and its package cache restored, dependencies installed, within the setup budget
inputs:
  budget:
    description: Seconds the setup may take
    default: "15"
runs:
  using: composite
  steps:
    - shell: bash
      run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
    - id: version
      shell: bash
      run: echo "bun=$(jq -r '.packageManager | sub("^bun@"; "")' package.json)" >> "$GITHUB_OUTPUT"
    - id: bun
      uses: actions/cache@v4
      with:
        path: ~/.bun-bin
        key: bun-bin-${{ runner.os }}-${{ steps.version.outputs.bun }}
    - if: steps.bun.outputs.cache-hit != 'true'
      shell: bash
      run: npm install --prefix ~/.bun-bin --no-fund --no-audit --no-save "bun@${{ steps.version.outputs.bun }}"
    - shell: bash
      run: echo "$HOME/.bun-bin/node_modules/.bin" >> "$GITHUB_PATH"
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-cache-${{ runner.os }}-
    - shell: bash
      run: bun install --frozen-lockfile
    - shell: bash
      run: |
        elapsed=$(( $(date +%s) - JOB_START ))
        echo "setup took ${elapsed}s (budget ${{ inputs.budget }}s)"
        [ "$elapsed" -le "${{ inputs.budget }}" ]
