x-database-url: &database-url postgresql://kanban:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/kanban?schema=public

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: kanban
      POSTGRES_DB: kanban
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: migrate
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      target: runner
    restart: unless-stopped
    mem_limit: 1g
    read_only: true
    tmpfs:
      - /app/.next/cache:uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: *database-url
      SESSION_SECRET: ${SERVICE_BASE64_64_SESSION}
      EMAIL_CODE_SECRET: ${SERVICE_BASE64_64_EMAILCODE}
      MAIL_FROM: ${MAIL_FROM:?}
      APP_URL: ${SERVICE_URL_APP}
      AWS_REGION: sa-east-1
      AWS_ACCESS_KEY_ID: ${MAIL_AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${MAIL_AWS_SECRET_ACCESS_KEY:?}
    labels:
      - traefik.http.routers.kanban-auth.rule=Host(`${SERVICE_FQDN_APP}`) && Method(`POST`) && (Path(`/sign-in`) || Path(`/sign-up`) || Path(`/verify-email`) || Path(`/forgot-password`) || Path(`/reset-password`))
      - traefik.http.routers.kanban-auth.priority=1000
      - traefik.http.routers.kanban-auth.entrypoints=https
      - traefik.http.routers.kanban-auth.tls=true
      - traefik.http.routers.kanban-auth.tls.certresolver=letsencrypt
      - traefik.http.routers.kanban-auth.middlewares=kanban-auth-ratelimit@file
      - traefik.http.routers.kanban-auth.service=kanban-auth
      - traefik.http.services.kanban-auth.loadbalancer.server.port=3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  db-dump:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: kanban
      PGDATABASE: kanban
      PGPASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          pg_dump --format=custom --file=/dumps/kanban.dump.partial \
            && mv /dumps/kanban.dump.partial /dumps/kanban.dump \
            || echo "db-dump: pg_dump failed" >&2
          sleep 3600
        done
    volumes:
      - dumps:/dumps
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "find /dumps/kanban.dump -mmin -130 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  backup:
    image: offen/docker-volume-backup:v2.50.1
    restart: unless-stopped
    environment:
      BACKUP_CRON_EXPRESSION: "30 5 * * *"
      BACKUP_FILENAME: kanban-%Y-%m-%dT%H-%M-%S.tar.gz
      BACKUP_PRUNING_PREFIX: kanban-
      BACKUP_RETENTION_DAYS: "7"
      BACKUP_EXCLUDE_REGEXP: \.partial$
      AWS_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      AWS_S3_BUCKET_NAME: ${BACKUP_S3_BUCKET:?}
      AWS_S3_PATH: ${BACKUP_S3_PATH:?}
      AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:?}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:?}
      NOTIFICATION_URLS: ${BACKUP_NOTIFICATION_URLS:?}
      NOTIFICATION_LEVEL: error
    volumes:
      - dumps:/backup/dumps:ro
    healthcheck:
      test: ["CMD", "pgrep", "-f", "backup -foreground"]
      interval: 60s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  dumps:
